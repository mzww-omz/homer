[workspace]
members = [
  "crates/homer-core",
  "crates/homer-storage",
  "crates/homer-inference",
  "crates/homer-ui",
  "crates/homer-app",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT"
authors = ["Homer"]

[workspace.dependencies]
homer-core = { path = "crates/homer-core" }
homer-storage = { path = "crates/homer-storage" }
homer-inference = { path = "crates/homer-inference" }
homer-ui = { path = "crates/homer-ui" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.42", features = ["bundled"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "stream", "rustls"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
tokio-util = "0.7"
futures-util = "0.3"
uuid = { version = "1", features = ["v4"] }
thiserror = "2"
async-channel = "2"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
gpui = "0.2.2"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1
